<!-- @dsCard group="Content" height=470 subtitle="Member card with role tag" -->
<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--bg)}.site{min-height:0}</style></head>
<body><div class="site">
<div style="padding:24px;max-width:400px"><div class="board-grid" style="grid-template-columns:1fr"><article class="board-card">
  <div class="board-card__photo is-president"><span class="board-card__role">President</span></div>
  <div class="board-card__body">
    <h3 class="board-card__name">Alex Example</h3>
    <div class="board-card__bio"><p>Long-time CPAN author and conference organiser. Joined the board to focus on fundraising.</p></div>
    <details class="board-card__moredetails"><summary class="board-toggle">More</summary><p>Additional biography.</p></details>
    <div class="board-card__meta"><span class="board-card__seat">Seat: <a href="#">Community</a></span><span class="board-card__email"><a href="#">alex@example.org</a></span></div>
  </div></article></div></div>
</div></body></html>
